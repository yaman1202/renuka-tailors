<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#743347" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="The requested Renuka Tailors page could not be found." />
    <title>Page Not Found | Renuka Tailors</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, "Helvetica Neue", Arial, sans-serif;
        color: #342321;
        background: #f5efe6;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        --burgundy: #743347;
        --wine: #48212e;
        --ivory: #f5efe6;
        --gold: #b99b68;
        --serif: "Playfair Display", Georgia, "Times New Roman", serif;
      }

      * { box-sizing: border-box; }
      body { min-width: 320px; min-height: 100vh; margin: 0; display: flex; flex-direction: column; }
      a { color: inherit; text-decoration: none; }
      .announcement { min-height: 31px; padding: 8px 20px; color: var(--ivory); background: var(--burgundy); text-align: center; font-size: 9px; font-weight: 600; letter-spacing: .19em; }
      .announcement span { padding: 0 5px; color: #d2b783; }
      header { height: 78px; padding: 0 max(24px, calc((100vw - 1200px) / 2)); display: flex; align-items: center; background: var(--ivory); border-bottom: 1px solid #e7dfd5; }
      .brand { display: inline-flex; align-items: center; gap: 12px; }
      .wordmark { display: flex; flex-direction: column; gap: 4px; line-height: 1; }
      .wordmark strong { color: var(--wine); font-family: var(--serif); font-size: 27px; font-weight: 500; letter-spacing: .1em; }
      .wordmark small { color: #766153; font-size: 8px; font-weight: 600; letter-spacing: .34em; }
      .city { padding-left: 12px; color: #766153; border-left: 1px solid #d5c4aa; font-size: 8px; font-weight: 600; letter-spacing: .17em; }
      main { width: min(100% - 48px, 1060px); margin: auto; padding: 62px 0 72px; }
      .eyebrow { margin: 0 0 16px; color: var(--burgundy); font-size: 10px; font-weight: 700; letter-spacing: .15em; }
      h1 { max-width: 850px; margin: 0; color: var(--burgundy); font-family: var(--serif); font-size: clamp(37px, 5vw, 58px); font-weight: 500; letter-spacing: -.03em; line-height: 1.12; }
      .copy { max-width: 690px; margin: 16px 0 25px; color: #514945; font-size: 13px; line-height: 1.75; }
      .link { min-height: 44px; padding: 0 16px; display: inline-flex; align-items: center; gap: 9px; color: var(--ivory); background: var(--burgundy); border: 1px solid var(--burgundy); font-size: 11px; font-weight: 600; transition: background .18s ease, transform .18s ease; }
      .link:hover { background: var(--wine); transform: translateY(-2px); }
      .link:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
      .arrow { color: #e3c991; font-size: 16px; }
      footer { padding: 18px 24px; color: #716962; background: #eee7de; border-top: 1px solid #d5cbbf; text-align: center; font-size: 9px; }

      @media (max-width: 520px) {
        header { height: 68px; padding-inline: 20px; }
        .wordmark strong { font-size: 23px; }
        .wordmark small { font-size: 7px; }
        .city { padding-left: 8px; font-size: 7px; }
        main { width: min(100% - 40px, 1060px); padding: 46px 0 56px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <div class="announcement">WOMEN’S TAILORING <span>/</span> MEERUT</div>
    <header>
      <a class="brand" href="/" aria-label="Renuka Tailors home">
        <span class="wordmark"><strong>RENUKA</strong><small>TAILORS</small></span>
        <span class="city">MEERUT</span>
      </a>
    </header>
    <main>
      <p class="eyebrow">404 · PAGE NOT FOUND</p>
      <h1>This page couldn’t be found.</h1>
      <p class="copy">The page may have moved or the address may be incorrect.</p>
      <a class="link" href="/">Return to the homepage <span class="arrow" aria-hidden="true">→</span></a>
    </main>
    <footer>© Renuka Tailors, Meerut · Founded in 1998</footer>
  </body>
</html>
